<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, sans-serif; background: #f7f8fa; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
// Make recharts available
const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Cell, LineChart, Line } = Recharts;

import { useState, useEffect } from "react";
// recharts loaded globally above

const BLUE="#1d6bfc",GREEN="#00c48c",RED="#f03e3e",AMBER="#f59e0b",PURPLE="#8b5cf6";
const BG="#fff",BGS="#f7f8fa",BDR="#e8eaed",TXT="#0a0a0a",SUB="#6b7280",MUT="#9ca3af";
const CATS={futbol:"⚽ Fútbol",trading:"🃏 Trading",nba:"🏀 NBA",baseball:"⚾ Baseball",f1:"🏎️ F1",other:"🏅 Otro"};
const RARS=["Común","Poco común","Rara","Ultra Rara","Legendaria"];
const RCLR={"Común":"#9ca3af","Poco común":"#10b981","Rara":"#3b82f6","Ultra Rara":"#8b5cf6","Legendaria":"#f59e0b"};
const CONDS=["Raw","PSA 1","PSA 2","PSA 3","PSA 4","PSA 5","PSA 6","PSA 7","PSA 8","PSA 9","PSA 10","BGS 9","BGS 9.5","BGS 10"];
const PLATS=["eBay","Wallapop","Cardmarket","Vinted","TCGPlayer","Otro"];
const DEFAULT_LOCATIONS=["Caja 1","Caja 2","Caja 3","Caja 4"];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function eu(n){return"€"+(+(n||0)).toFixed(2);}
function euk(n){n=+(n||0);return n>=1000?"€"+(n/1000).toFixed(1)+"k":"€"+n.toFixed(2);}
function pc(s,b){return b?((s-b)/b*100):0;}
function sg(n){return n>=0?"+":"";}
function cl(n){return n>=0?GREEN:RED;}
function np(c){return(c.sellPrice||0)*(c.quantity||1)*(1-(c.platformFee||0)/100)-(c.shippingCost||0)-(c.buyPrice||0)*(c.quantity||1);}
function daysSince(dateStr){if(!dateStr)return null;return Math.floor((Date.now()-new Date(dateStr))/86400000);}
function apyCalc(c){
  if(!c.sellDate||!c.buyDate)return null;
  const d=(new Date(c.sellDate)-new Date(c.buyDate))/86400000;
  if(d<=0)return null;
  const base=(c.buyPrice||0)*(c.quantity||1);
  if(!base)return null;
  const r=pc((c.sellPrice||0)*(1-(c.platformFee||0)/100)-(c.shippingCost||0),base);
  return(Math.pow(1+r/100,365/d)-1)*100;
}

function dlJSON(cards,invoices){
  const d=JSON.stringify({cards,invoices,exported:new Date().toISOString()},null,2);
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d],{type:"application/json"}));
  a.download="cromovault-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function ulJSON(sc,si){
  const i=document.createElement("input");i.type="file";i.accept=".json";
  i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.cards){sc(d.cards);if(d.invoices)si(d.invoices);alert("Importado correctamente ✓");}else alert("Archivo no válido");}catch{alert("Error al leer el archivo");}};
    r.readAsText(f);};
  document.body.appendChild(i);i.click();document.body.removeChild(i);
}
function dlPDF(cards){
  const inv=cards.filter(c=>c.mode==="inventory"),sold=inv.filter(c=>c.status==="sold"),hold=inv.filter(c=>c.status!=="sold");
  const ti=inv.reduce((a,c)=>a+(c.buyPrice||0)*(c.quantity||1),0),tr=sold.reduce((a,c)=>a+np(c),0),ri=ti?pc(ti+tr,ti):0;
  const sr=sold.map(c=>{const bp=(c.buyPrice||0)*(c.quantity||1),sp=(c.sellPrice||0)*(c.quantity||1),f=sp*((c.platformFee||0)/100),sh=c.shippingCost||0,n=sp-f-sh-bp,r=pc(sp-f-sh,bp);return`<tr><td>${c.name}</td><td align=right>€${bp.toFixed(2)}</td><td align=right>€${sp.toFixed(2)}</td><td align=right>-€${(f+sh).toFixed(2)}</td><td align=right style="color:${n>=0?"green":"red"}">${n>=0?"+":""}€${n.toFixed(2)}</td><td align=right style="color:${r>=0?"green":"red"}">${r>=0?"+":""}${r.toFixed(1)}%</td></tr>`;}).join("");
  const hr=hold.map(c=>`<tr><td>${c.name}${c.isFavorite?" ⭐":""}</td><td>${CATS[c.category]||c.category}</td><td>${c.rarity}</td><td align=right>€${((c.buyPrice||0)*(c.quantity||1)).toFixed(2)}</td></tr>`).join("");
  const tB=sold.reduce((a,c)=>a+(c.buyPrice||0)*(c.quantity||1),0),tS=sold.reduce((a,c)=>a+(c.sellPrice||0)*(c.quantity||1),0),tF=sold.reduce((a,c)=>a+(c.sellPrice||0)*(c.quantity||1)*((c.platformFee||0)/100)+(c.shippingCost||0),0),tN=tS-tF-tB;
  const html=`<!DOCTYPE html><html><head><meta charset=utf-8><title>CromoVault</title><style>body{font-family:sans-serif;padding:24px;font-size:12px}.k{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}.ki{border:1px solid #e8eaed;border-radius:6px;padding:10px}.kl{font-size:10px;color:#6b7280}.kv{font-size:18px;font-weight:700}h2{font-size:12px;font-weight:600;margin:14px 0 6px;border-bottom:1px solid #e8eaed;padding-bottom:4px}table{width:100%;border-collapse:collapse}th{padding:5px 7px;text-align:left;font-size:10px;font-weight:600;color:#6b7280;border-bottom:1px solid #e8eaed}td{padding:6px 7px;border-bottom:1px solid #f3f4f6}.tot{font-weight:700;background:#f7f8fa}</style></head><body>
  <h1 style="font-size:18px;margin-bottom:4px">CromoVault</h1><p style="color:#6b7280;margin-bottom:16px">${new Date().toLocaleDateString("es-ES",{day:"2-digit",month:"long",year:"numeric"})}</p>
  <div class=k><div class=ki><div class=kl>INVERTIDO</div><div class=kv>€${ti.toFixed(2)}</div></div><div class=ki><div class=kl>P&L</div><div class=kv style="color:${tr>=0?"green":"red"}">${tr>=0?"+":""}€${tr.toFixed(2)}</div></div><div class=ki><div class=kl>ROI</div><div class=kv style="color:${ri>=0?"green":"red"}">${ri>=0?"+":""}${ri.toFixed(1)}%</div></div><div class=ki><div class=kl>EN CARTERA</div><div class=kv>${hold.length}</div></div></div>
  <h2>Ventas (${sold.length})</h2><table><thead><tr><th>Carta</th><th>Compra</th><th>Venta</th><th>Gastos</th><th>Beneficio</th><th>ROI</th></tr></thead><tbody>${sr}<tr class=tot><td>TOTAL</td><td align=right>€${tB.toFixed(2)}</td><td align=right>€${tS.toFixed(2)}</td><td align=right>-€${tF.toFixed(2)}</td><td align=right style="color:${tN>=0?"green":"red"}">${tN>=0?"+":""}€${tN.toFixed(2)}</td><td></td></tr></tbody></table>
  <h2>Cartera (${hold.length})</h2><table><thead><tr><th>Carta</th><th>Cat.</th><th>Rareza</th><th>Coste</th></tr></thead><tbody>${hr}</tbody></table></body></html>`;
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
  a.download="cromovault-"+new Date().toISOString().slice(0,10)+".html";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

const IS={width:"100%",padding:"9px 12px",borderRadius:8,border:"1.5px solid "+BDR,background:BG,color:TXT,fontSize:13,outline:"none",boxSizing:"border-box",fontFamily:"Inter,sans-serif"};
const LS={display:"block",color:SUB,fontSize:11,fontWeight:500,marginBottom:5};

function Btn({children,onClick,disabled,v,sm,full,style}){
  v=v||"primary";
  let bg=BLUE,fg="#fff",bo="none";
  if(disabled){bg=BDR;fg=MUT;}
  else if(v==="outline"){bg="transparent";fg=SUB;bo="1.5px solid "+BDR;}
  else if(v==="ghost"){bg="transparent";fg=SUB;}
  else if(v==="success"){bg=GREEN;fg="#fff";}
  return(<button onClick={onClick} disabled={disabled} style={{padding:sm?"7px 13px":"10px 18px",borderRadius:8,fontFamily:"Inter,sans-serif",fontWeight:600,fontSize:sm?11:13,cursor:disabled?"not-allowed":"pointer",width:full?"100%":"auto",whiteSpace:"nowrap",opacity:disabled?0.5:1,background:bg,color:fg,border:bo,...(style||{})}}>{children}</button>);
}
function Bdg({children,color:c,bg,dot}){return(<span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"2px 8px",borderRadius:20,background:bg||BGS,color:c||SUB,fontSize:11,fontWeight:500,whiteSpace:"nowrap"}}>{dot&&<span style={{width:6,height:6,borderRadius:"50%",background:c,flexShrink:0}}/>}{children}</span>);}
function Card({children,style}){return <div style={{background:BG,border:"1px solid "+BDR,borderRadius:12,...(style||{})}}>{children}</div>;}
function SL({children,style}){return <div style={{fontSize:11,fontWeight:600,color:MUT,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:12,...(style||{})}}>{children}</div>;}
function Empty({icon,title,sub,cta,onCta}){return(<div style={{padding:"48px 20px",textAlign:"center"}}><div style={{fontSize:36,marginBottom:12}}>{icon}</div><div style={{fontSize:14,fontWeight:600,marginBottom:6}}>{title}</div>{sub&&<div style={{fontSize:12,color:MUT,marginBottom:16}}>{sub}</div>}{cta&&<Btn onClick={onCta}>{cta}</Btn>}</div>);}
function KT({label,value,sub,accent,br}){return(<div style={{padding:"20px 24px",borderRight:br?"1px solid "+BDR:"none",flex:1,minWidth:100}}><div style={{fontSize:11,fontWeight:500,color:SUB,marginBottom:8}}>{label}</div><div style={{fontSize:22,fontWeight:700,color:accent||TXT,letterSpacing:"-0.02em",lineHeight:1}}>{value}</div>{sub&&<div style={{marginTop:5,fontSize:11,color:MUT}}>{sub}</div>}</div>);}
function TH({cols}){return(<thead><tr style={{borderBottom:"1.5px solid "+BDR,background:BGS}}>{cols.map(([l,a],i)=><th key={i} style={{padding:"9px 12px",textAlign:a||"left",fontSize:11,fontWeight:600,color:SUB,letterSpacing:"0.04em"}}>{l}</th>)}</tr></thead>);}

function LstModal({card,onClose}){
  const[cp,setCp]=useState(false);
  const txt=[`🃏 ${card.name}`,card.series?`📦 Set: ${card.series}`:null,`✨ Rareza: ${card.rarity}`,`📊 ${card.condition&&card.condition!=="Raw"?card.condition:"Sin gradar"}`,card.quantity>1?`🔢 ×${card.quantity}`:null,card.notes?`📝 ${card.notes}`:null,"","✅ Envío disponible.","💬 Más fotos disponibles."].filter(l=>l!==null).join("\n");
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}><div style={{background:BG,borderRadius:16,width:"100%",maxWidth:400,boxShadow:"0 20px 60px rgba(0,0,0,0.18)",border:"1px solid "+BDR}}><div style={{padding:"16px 22px",borderBottom:"1px solid "+BDR,display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{fontSize:15,fontWeight:700}}>📋 Ficha de venta</div><button onClick={onClose} style={{background:"none",border:"none",fontSize:18,color:MUT,cursor:"pointer"}}>✕</button></div><div style={{padding:"18px 22px"}}><textarea readOnly value={txt} rows={9} style={{...IS,resize:"none",background:BGS,fontSize:12,lineHeight:1.7,marginBottom:14}}/><div style={{display:"flex",gap:8}}><Btn v="outline" full onClick={onClose}>Cerrar</Btn><Btn full onClick={()=>{navigator.clipboard.writeText(txt);setCp(true);setTimeout(()=>setCp(false),2000);}}>{cp?"✓ Copiado":"Copiar"}</Btn></div></div></div></div>);
}

function SellModal({card,onSave,onClose}){
  const maxQty=card.quantity||1;
  const[qty,setQty]=useState("1"),[pr,setPr]=useState(""),[dt,setDt]=useState(new Date().toISOString().slice(0,10)),[fe,setFe]=useState(String(card.platformFee||"")),[sh,setSh]=useState(String(card.shippingCost||"")),[pl,setPl]=useState(card.platform||"eBay");
  const sellQty=Math.min(parseInt(qty)||1,maxQty);
  const buy=(card.buyPrice||0)*sellQty;
  const sell=(parseFloat(pr)||0)*sellQty;
  const fa=sell*((parseFloat(fe)||0)/100);
  const sa=parseFloat(sh)||0;
  const n=sell-fa-sa-buy;
  const minRoi=parseFloat(localStorage.getItem("cv10_minroi")||"30");
  const roi=buy>0?pc(sell-fa-sa,buy):0;
  const belowMin=pr&&roi<minRoi;
  function confirm(){
    const remaining=maxQty-sellQty;
    if(remaining>0){
      // Update original card with remaining units
      onSave({...card,quantity:remaining});
      // Create a new sold record
      onSave({...card,id:uid(),quantity:sellQty,status:"sold",sellPrice:parseFloat(pr)||0,sellDate:dt,platformFee:parseFloat(fe)||0,shippingCost:parseFloat(sh)||0,platform:pl});
    } else {
      // All units sold
      onSave({...card,status:"sold",sellPrice:parseFloat(pr)||0,sellDate:dt,platformFee:parseFloat(fe)||0,shippingCost:parseFloat(sh)||0,platform:pl});
    }
    onClose();
  }
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:BG,borderRadius:16,width:"100%",maxWidth:380,boxShadow:"0 20px 60px rgba(0,0,0,0.18)",border:"1px solid "+BDR}}>
        <div style={{padding:"16px 22px",borderBottom:"1px solid "+BDR,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:15,fontWeight:700}}>Registrar venta</div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:18,color:MUT,cursor:"pointer"}}>✕</button>
        </div>
        <div style={{padding:"18px 22px"}}>
          <div style={{padding:"9px 12px",background:BGS,borderRadius:8,marginBottom:14,fontSize:13,fontWeight:600}}>
            {card.name}
            {maxQty>1&&<span style={{color:MUT,fontWeight:400,marginLeft:8,fontSize:12}}>{maxQty} unidades disponibles</span>}
          </div>
          {maxQty>1&&(
            <div style={{marginBottom:10}}>
              <label style={LS}>¿Cuántas unidades vendes?</label>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <input type="number" min="1" max={maxQty} value={qty} onChange={e=>setQty(e.target.value)} style={{...IS,maxWidth:80}}/>
                <span style={{fontSize:12,color:SUB}}>de {maxQty} · quedarán <b>{maxQty-sellQty}</b></span>
              </div>
            </div>
          )}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div><label style={LS}>Precio/ud (€)</label><input type="number" min="0" step="0.01" value={pr} onChange={e=>setPr(e.target.value)} placeholder="0.00" style={IS} autoFocus/></div>
            <div><label style={LS}>Fecha</label><input type="date" value={dt} onChange={e=>setDt(e.target.value)} style={IS}/></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
            <div><label style={LS}>Comisión (%)</label><input type="number" min="0" step="0.1" value={fe} onChange={e=>setFe(e.target.value)} placeholder="0" style={IS}/></div>
            <div><label style={LS}>Envío (€)</label><input type="number" min="0" step="0.01" value={sh} onChange={e=>setSh(e.target.value)} placeholder="0.00" style={IS}/></div>
            <div><label style={LS}>Plataforma</label><select value={pl} onChange={e=>setPl(e.target.value)} style={IS}>{PLATS.map(p=><option key={p} value={p}>{p}</option>)}</select></div>
          </div>
          {pr&&<div style={{background:n>=0?"#f0fdf8":"#fff5f5",borderRadius:10,padding:"12px 14px",marginBottom:10}}>
            {[["Ingresos",eu(sell),TXT],["Comisión","-"+eu(fa),RED],["Envío","-"+eu(sa),RED],["Coste","-"+eu(buy),SUB],["Beneficio neto",(n>=0?"+":"")+eu(n),cl(n)]].map(([l,v,c])=>(
              <div key={l} style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontSize:12,color:SUB}}>{l}</span>
                <span style={{fontSize:13,fontWeight:l==="Beneficio neto"?700:500,color:c}}>{v}</span>
              </div>
            ))}
          </div>}
          {belowMin&&<div style={{background:"#fff5f5",border:"1px solid #fecaca",borderRadius:8,padding:"9px 12px",marginBottom:10,fontSize:12,color:RED}}>
            <b>⚠️ ROI por debajo del mínimo ({roi.toFixed(1)}% &lt; {minRoi}%)</b> — puedes confirmar igualmente
          </div>}
          {maxQty>1&&sellQty<maxQty&&pr&&<div style={{background:"#eff4ff",border:"1px solid #bfdbfe",borderRadius:8,padding:"9px 12px",marginBottom:10,fontSize:12,color:BLUE}}>
            📦 Quedarán <b>{maxQty-sellQty} unidades</b> en cartera a €{(card.buyPrice||0).toFixed(2)}/ud
          </div>}
          <Btn v="success" full onClick={confirm} disabled={!pr}>Confirmar venta</Btn>
        </div>
      </div>
    </div>
  );
}

function CardForm({onSave,onClose,editCard,defMode}){
  const blank={name:"",category:"trading",series:"",rarity:"Común",condition:"Raw",quantity:1,buyPrice:"",buyDate:new Date().toISOString().slice(0,10),notes:"",images:[],status:"holding",sellPrice:"",sellDate:"",platformFee:"",shippingCost:"",platform:"eBay",isFavorite:false,mode:defMode||"inventory",targetPrice:"",listingDate:"",location:""};
  const init=editCard?{...editCard,buyPrice:String(editCard.buyPrice||""),sellPrice:String(editCard.sellPrice||""),platformFee:String(editCard.platformFee||""),shippingCost:String(editCard.shippingCost||""),targetPrice:String(editCard.targetPrice||"")}:blank;
  const[f,setF]=useState(init),[imgs,setImgs]=useState(editCard?.images||[]),[tab,setTab]=useState("info");
  const fr={current:null};
  function sf(k,v){setF(p=>({...p,[k]:v}));}
  function addImgs(files){Array.from(files).forEach(file=>{const r=new FileReader();r.onload=e=>setImgs(p=>[...p,e.target.result]);r.readAsDataURL(file);});}
  const tB=(parseFloat(f.buyPrice)||0)*(f.quantity||1),tS=(parseFloat(f.sellPrice)||0)*(f.quantity||1),fA=tS*((parseFloat(f.platformFee)||0)/100),sA=parseFloat(f.shippingCost)||0,ns=tS-fA-sA-tB;
  const tabs=f.mode==="inventory"?[["info","Info"],["buy","Compra"],["sell","Venta"],["photos","Fotos"]]:[["info","Info"],["buy","Precio"],["photos","Fotos"]];
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16,overflowY:"auto"}}>
      <div style={{background:BG,borderRadius:16,width:"100%",maxWidth:480,maxHeight:"94vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,0.18)",border:"1px solid "+BDR}}>
        <div style={{padding:"18px 24px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:16,fontWeight:700}}>{editCard?"Editar carta":"Nueva carta"}</div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <button onClick={()=>sf("isFavorite",!f.isFavorite)} style={{background:"none",border:"none",fontSize:18,cursor:"pointer",opacity:f.isFavorite?1:0.3}}>⭐</button>
            <button onClick={onClose} style={{background:"none",border:"none",fontSize:18,color:MUT,cursor:"pointer"}}>✕</button>
          </div>
        </div>
        <div style={{padding:"12px 24px 0"}}>
          <div style={{display:"flex",background:BGS,borderRadius:10,padding:3}}>
            {[["inventory","📦 Inventario"],["collection","⭐ Colección"]].map(([k,l])=>(
              <button key={k} onClick={()=>sf("mode",k)} style={{flex:1,padding:"7px 0",borderRadius:8,border:"none",cursor:"pointer",background:f.mode===k?BG:"transparent",color:f.mode===k?TXT:SUB,fontFamily:"Inter,sans-serif",fontWeight:f.mode===k?600:500,fontSize:12}}>{l}</button>
            ))}
          </div>
        </div>
        <div style={{display:"flex",borderBottom:"1px solid "+BDR,marginTop:12,padding:"0 24px"}}>
          {tabs.map(([k,l])=><button key={k} onClick={()=>setTab(k)} style={{padding:"8px 14px",border:"none",background:"none",borderBottom:"2px solid "+(tab===k?BLUE:"transparent"),color:tab===k?BLUE:SUB,fontFamily:"Inter,sans-serif",fontWeight:500,fontSize:12,cursor:"pointer"}}>{l}</button>)}
        </div>
        <div style={{padding:"18px 24px"}}>
          {tab==="info"&&(
            <div>
              {f.mode==="inventory"&&(
                <div style={{marginBottom:14}}>
                  <label style={LS}>Estado</label>
                  <div style={{display:"flex",gap:8,marginBottom:8}}>
                    {[["holding","En cartera",BLUE],["listed","En venta",AMBER],["sold","Vendida",GREEN]].map(([k,l,ac])=>(
                      <button key={k} onClick={()=>sf("status",k)} style={{flex:1,padding:"8px 0",borderRadius:8,cursor:"pointer",border:"1.5px solid "+(f.status===k?ac:BDR),background:f.status===k?ac+"18":"transparent",color:f.status===k?ac:SUB,fontFamily:"Inter,sans-serif",fontWeight:500,fontSize:11}}>{l}</button>
                    ))}
                  </div>
                  {f.status==="sold"&&(f.quantity||1)>1&&(
                    <div style={{background:"#f0fdf8",border:"1px solid #d1fae5",borderRadius:8,padding:"10px 12px"}}>

                      <div style={{display:"flex",alignItems:"center",gap:10}}>

function CardRow({card,onEdit,onDelete,onSell,onDuplicate,showPnl}){

  const daysListed=isListed&&card.listingDate?daysSince(card.listingDate):null;
  const alert30=daysListed!==null&&daysListed>=30;
  const alert14=daysListed!==null&&daysListed>=14&&daysListed<30;

    <>

        <td style={{padding:"12px 16px",verticalAlign:"middle"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>

            <div>
              <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
                {card.isFavorite&&<span style={{fontSize:11}}>⭐</span>}
                <span style={{fontSize:13,fontWeight:600}}>{card.name}</span>
                {alert30&&<span style={{fontSize:10,background:"#fecaca",color:RED,borderRadius:4,padding:"1px 5px",fontWeight:600}}>+{daysListed}d</span>}
                {alert14&&!alert30&&<span style={{fontSize:10,background:"#fde68a",color:AMBER,borderRadius:4,padding:"1px 5px",fontWeight:600}}>{daysListed}d</span>}
              </div>
              <div style={{fontSize:11,color:MUT,marginTop:1}}>{card.series||CATS[card.category]}{card.condition&&card.condition!=="Raw"?" · "+card.condition:""}</div>
            </div>
          </div>
        </td>

        <td style={{padding:"12px 12px",verticalAlign:"middle",textAlign:"right"}}><div style={{fontSize:13,fontWeight:600}}>{eu(cost)}</div>{card.quantity>1&&<div style={{fontSize:11,color:MUT}}>×{card.quantity}</div>}</td>
        {displayPnl&&<td style={{padding:"12px 12px",verticalAlign:"middle",textAlign:"right"}}>{isSold?(<div><div style={{fontSize:13,fontWeight:700,color:cl(n)}}>{sg(n)}{eu(n)}</div><div style={{fontSize:11,color:MUT}}>{sg(r)}{r.toFixed(1)}%{ap!==null?" · "+sg(ap)+ap.toFixed(0)+"%/a":""}</div></div>):tt?(<div style={{fontSize:11,color:cl(tt)}}>🎯 {sg(tt)}{eu(tt)}</div>):(<span style={{color:MUT,fontSize:12}}>—</span>)}</td>}
        <td style={{padding:"12px 12px",verticalAlign:"middle",textAlign:"center"}}>{isSold?<Bdg color={GREEN} bg="#f0fdf8" dot>Vendida</Bdg>:isListed?<Bdg color={AMBER} bg="#fffbeb" dot>En venta</Bdg>:card.mode==="collection"?<Bdg color={PURPLE} bg="#f5f3ff" dot>Colección</Bdg>:<Bdg color={BLUE} bg="#eff4ff" dot>Cartera</Bdg>}</td>

            <a href={"https://www.130point.com/sales/?q="+encodeURIComponent(card.name)} target="_blank" rel="noreferrer" style={{padding:"7px 9px",borderRadius:8,border:"1.5px solid #e8eaed",background:"transparent",color:SUB,fontSize:11,fontWeight:600,textDecoration:"none",display:"inline-flex",alignItems:"center"}}>🔍</a>

            <Btn sm v="outline" style={{color:RED,borderColor:"#fecaca"}} onClick={()=>onDelete(card.id)}>✕</Btn>
          </div>
        </td>

      {open&&(<tr style={{background:BGS}}><td colSpan={displayPnl?6:5} style={{padding:"9px 16px 11px 70px",borderBottom:"1px solid "+BDR}}><div style={{display:"flex",gap:20,flexWrap:"wrap",fontSize:12,color:SUB}}>{card.buyDate&&<span>Compra: <b style={{color:TXT}}>{card.buyDate}</b></span>}{isSold&&<span>Venta: <b style={{color:TXT}}>{card.sellDate||"—"}</b>{card.platform?" via "+card.platform:""}</span>}{isListed&&daysListed!==null&&<span style={{color:daysListed>=30?RED:AMBER}}>⏱ {daysListed} días en venta</span>}{card.targetPrice>0&&!isSold&&<span style={{color:BLUE}}>🎯 {eu(card.targetPrice)}</span>}{card.notes&&<span>📝 {card.notes}</span>}{card.location&&<span>📦 {card.location}</span>}<a href={"https://www.130point.com/sales/?q="+encodeURIComponent(card.name)} target="_blank" rel="noreferrer" style={{color:BLUE,textDecoration:"none",fontWeight:500}}>130point →</a></div></td></tr>)}
    </>
  );
}

function DashTab({cards,onEdit,onDelete,onSell,onDuplicate}){
  const inv=cards.filter(c=>c.mode==="inventory"),sold=inv.filter(c=>c.status==="sold"),hold=inv.filter(c=>c.status!=="sold"),listed=inv.filter(c=>c.status==="listed");
  const invested=inv.reduce((a,c)=>a+(c.buyPrice||0)*(c.quantity||1),0);
  const recovered=sold.reduce((a,c)=>a+(c.sellPrice||0)*(c.quantity||1)*(1-(c.platformFee||0)/100)-(c.shippingCost||0),0);
  const inPortfolio=hold.reduce((a,c)=>a+(c.buyPrice||0)*(c.quantity||1),0);
  const realized=sold.reduce((a,c)=>a+np(c),0);
  const balance=recovered+inPortfolio-invested;

  const topSold=sold.map(c=>({name:c.name,pnl:np(c),r:pc((c.sellPrice||0)*(1-(c.platformFee||0)/100)-(c.shippingCost||0),(c.buyPrice||0)*(c.quantity||1))})).sort((a,b)=>b.pnl-a.pnl).slice(0,4);
  const favs=cards.filter(c=>c.isFavorite).slice(0,4);
  const recent=inv.slice().sort((a,b)=>(b.buyDate||"").localeCompare(a.buyDate||"")).slice(0,5);

function AnalyticsTab({cards}){
  const sold=cards.filter(c=>c.mode==="inventory"&&c.status==="sold");

  // Avg days to sell by category
  const catStats=Object.entries(CATS).map(([k,label])=>{
    const cs=sold.filter(c=>c.category===k&&c.buyDate&&c.sellDate);
    if(!cs.length)return null;
    const avgDays=cs.reduce((a,c)=>a+(new Date(c.sellDate)-new Date(c.buyDate))/86400000,0)/cs.length;
    const avgRoi=cs.reduce((a,c)=>a+pc((c.sellPrice||0)*(1-(c.platformFee||0)/100)-(c.shippingCost||0),(c.buyPrice||0)*(c.quantity||1)),0)/cs.length;
    return{k,label,count:cs.length,avgDays:Math.round(avgDays),avgRoi};
  }).filter(Boolean);

  // Platform stats
  const platStats=PLATS.map(p=>{
    const ps=sold.filter(c=>c.platform===p);
    if(!ps.length)return null;
    const avgRoi=ps.reduce((a,c)=>a+pc((c.sellPrice||0)*(1-(c.platformFee||0)/100)-(c.shippingCost||0),(c.buyPrice||0)*(c.quantity||1)),0)/ps.length;
    const avgFee=ps.reduce((a,c)=>a+(c.platformFee||0),0)/ps.length;
    const totalProfit=ps.reduce((a,c)=>a+np(c),0);
    return{p,count:ps.length,avgRoi,avgFee,totalProfit};
  }).filter(Boolean).sort((a,b)=>b.totalProfit-a.totalProfit);

  // IRPF estimation
  const yr=new Date().getFullYear();
  const profit=sold.filter(c=>(c.sellDate||"").startsWith(String(yr))).reduce((a,c)=>a+np(c),0);
  function irpf(p){
    if(p<=6000)return p*0.19;
    if(p<=50000)return 6000*0.19+(p-6000)*0.21;
    if(p<=200000)return 6000*0.19+44000*0.21+(p-50000)*0.23;
    return 6000*0.19+44000*0.21+150000*0.23+(p-200000)*0.27;
  }
  const taxEst=profit>0?irpf(profit):0;

  // Location management
  const[locs,setLocs]=useState(()=>{try{return JSON.parse(localStorage.getItem("cv10_locs")||"null")||DEFAULT_LOCATIONS;}catch{return DEFAULT_LOCATIONS;}});
  const[newLoc,setNewLoc]=useState("");
  function saveLocs(l){setLocs(l);localStorage.setItem("cv10_locs",JSON.stringify(l));}

  return(
    <div>
      <div style={{fontSize:20,fontWeight:700,marginBottom:20}}>Análisis</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20,marginBottom:20}}>
        {/* Tiempo medio por categoría */}
        <Card style={{padding:"18px"}}>
          <SL>⏱ Tiempo medio de venta</SL>
          {catStats.length>0?(
            <table style={{width:"100%",borderCollapse:"collapse"}}>
              <TH cols={[["Categoría"],["Ops","right"],["Días","right"],["ROI medio","right"]]}/>
              <tbody>{catStats.map(s=>(
                <tr key={s.k} style={{borderBottom:"1px solid "+BDR}}>
                  <td style={{padding:"9px 12px",fontSize:13}}>{s.label}</td>
                  <td style={{padding:"9px 12px",textAlign:"right",fontSize:12,color:SUB}}>{s.count}</td>
                  <td style={{padding:"9px 12px",textAlign:"right",fontSize:13,fontWeight:600,color:s.avgDays>30?RED:s.avgDays>14?AMBER:GREEN}}>{s.avgDays}d</td>
                  <td style={{padding:"9px 12px",textAlign:"right",fontSize:13,fontWeight:600,color:cl(s.avgRoi)}}>{sg(s.avgRoi)}{s.avgRoi.toFixed(1)}%</td>
                </tr>
              ))}</tbody>
            </table>
          ):<Empty icon="⏱" title="Sin datos" sub="Necesitas ventas con fecha de compra y venta"/>}
        </Card>

        {/* Mejor plataforma */}
        <Card style={{padding:"18px"}}>
          <SL>🏆 Rendimiento por plataforma</SL>
          {platStats.length>0?(
            <table style={{width:"100%",borderCollapse:"collapse"}}>
              <TH cols={[["Plataforma"],["Ventas","right"],["ROI","right"],["Comisión","right"]]}/>
              <tbody>{platStats.map((s,i)=>(
                <tr key={s.p} style={{borderBottom:"1px solid "+BDR,background:i===0?"#f0fdf8":"transparent"}}>
                  <td style={{padding:"9px 12px",fontSize:13}}>{i===0?"🥇 ":""}{s.p}</td>
                  <td style={{padding:"9px 12px",textAlign:"right",fontSize:12,color:SUB}}>{s.count}</td>
                  <td style={{padding:"9px 12px",textAlign:"right",fontSize:13,fontWeight:600,color:cl(s.avgRoi)}}>{sg(s.avgRoi)}{s.avgRoi.toFixed(1)}%</td>
                  <td style={{padding:"9px 12px",textAlign:"right",fontSize:12,color:SUB}}>{s.avgFee.toFixed(1)}%</td>
                </tr>
              ))}</tbody>
            </table>
          ):<Empty icon="🏆" title="Sin datos" sub="Registra ventas con plataforma para ver estadísticas"/>}
        </Card>
      </div>

      {/* IRPF */}
      <Card style={{marginBottom:20,padding:"18px"}}>
        <SL style={{marginBottom:12}}>🧾 Estimación IRPF {yr}</SL>
        {profit>0?(
          <div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12,marginBottom:14}}>
              {[{l:"Beneficio "+yr,v:eu(profit),c:cl(profit)},{l:"IRPF estimado",v:eu(taxEst),c:RED},{l:"Neto tras impuestos",v:eu(profit-taxEst),c:cl(profit-taxEst)},{l:"Tipo efectivo",v:(profit>0?(taxEst/profit*100):0).toFixed(1)+"%",c:SUB}].map(({l,v,c})=>(
                <div key={l} style={{background:BGS,borderRadius:10,padding:"12px 14px",border:"1px solid "+BDR}}>
                  <div style={{fontSize:11,color:SUB,marginBottom:4}}>{l}</div>
                  <div style={{fontSize:18,fontWeight:700,color:c}}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:8,padding:"10px 14px",fontSize:11,color:SUB}}>
              ⚠️ Estimación orientativa según tramos IRPF 2024 para ganancias patrimoniales (19% hasta 6.000€ · 21% hasta 50.000€ · 23% hasta 200.000€ · 27% a partir de 200.000€). Consulta con un gestor para tu caso concreto.
            </div>
          </div>
        ):<Empty icon="🧾" title={"Sin beneficios en "+yr} sub="Cuando tengas ventas cerradas en el año actual aparecerá la estimación"/>}
      </Card>

      {/* Min ROI setting */}
      <Card style={{padding:"18px",marginBottom:20}}>
        <SL style={{marginBottom:12}}>🎯 Margen mínimo de venta</SL>
        {(()=>{
          const[minRoi,setMinRoi]=useState(()=>parseFloat(localStorage.getItem("cv10_minroi")||"30"));
          function saveMin(v){setMinRoi(v);localStorage.setItem("cv10_minroi",String(v));}
          return(<div>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}>
              <input type="number" min="0" max="200" step="1" value={minRoi} onChange={e=>saveMin(parseFloat(e.target.value)||0)} style={{...IS,maxWidth:100}}/>
              <span style={{fontSize:13,color:SUB}}>% ROI mínimo</span>
              <div style={{padding:"6px 12px",borderRadius:8,background:RED+"18",border:"1px solid #fecaca",fontSize:12,color:RED,fontWeight:600}}>Al vender por debajo de {minRoi}% saldrá aviso en rojo</div>
            </div>
          </div>);
        })()}
      </Card>

      {/* Location manager */}
      <Card style={{padding:"18px"}}>
        <SL style={{marginBottom:12}}>📦 Gestionar ubicaciones físicas</SL>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}}>
          {locs.map((l,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:6,background:BGS,border:"1px solid "+BDR,borderRadius:8,padding:"6px 10px"}}>
              <span style={{fontSize:13}}>{l}</span>
              <button onClick={()=>saveLocs(locs.filter((_,j)=>j!==i))} style={{background:"none",border:"none",color:RED,cursor:"pointer",fontSize:12,fontWeight:700}}>✕</button>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:8}}>
          <input value={newLoc} onChange={e=>setNewLoc(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&newLoc.trim()){saveLocs([...locs,newLoc.trim()]);setNewLoc("");}}} placeholder="Nueva ubicación (ej: Estantería A)..." style={{...IS,maxWidth:280}}/>
          <Btn onClick={()=>{if(newLoc.trim()){saveLocs([...locs,newLoc.trim()]);setNewLoc("");}}} disabled={!newLoc.trim()}>Añadir</Btn>
        </div>
        <div style={{marginTop:10,fontSize:11,color:MUT}}>Las ubicaciones que añadas aquí estarán disponibles al editar cualquier carta.</div>
      </Card>
    </div>
  );
}

const PSA_SERVICES=[{k:"economy",l:"Economy",days:45},{k:"regular",l:"Regular",days:20},{k:"express",l:"Express",days:10},{k:"walkthrough",l:"Walkthrough",days:5}];
const PSA_STATUS=[["sent","📬 Enviada"],["grading","🔍 En proceso"],["done","✅ Recibida"],["sold","💰 Vendida"]];

function PSATab(){
  const[show,setShow]=useState(false),[items,setItems]=useState(()=>{try{return JSON.parse(localStorage.getItem("cv10p")||"[]");}catch{return[];}});
  const blank={name:"",series:"",cardCost:"",shippingCost:"",gradingCost:"",sentDate:new Date().toISOString().slice(0,10),service:"economy",status:"sent",grade:"",estSellPrice:"",realSellPrice:"",soldDate:"",notes:""};
  const[f,setF]=useState(blank),[editing,setEditing]=useState(null);
  function sf(k,v){setF(p=>({...p,[k]:v}));}
  useEffect(()=>{localStorage.setItem("cv10p",JSON.stringify(items));},[items]);
  function save(){
    const item={...f,id:editing||uid(),cardCost:parseFloat(f.cardCost)||0,shippingCost:parseFloat(f.shippingCost)||0,gradingCost:parseFloat(f.gradingCost)||0,estSellPrice:parseFloat(f.estSellPrice)||0,realSellPrice:parseFloat(f.realSellPrice)||0};
    setItems(p=>editing?p.map(x=>x.id===editing?item:x):[item,...p]);
    setF(blank);setEditing(null);setShow(false);
  }
  function openEdit(i){setF({...i,cardCost:String(i.cardCost||""),shippingCost:String(i.shippingCost||""),gradingCost:String(i.gradingCost||""),estSellPrice:String(i.estSellPrice||""),realSellPrice:String(i.realSellPrice||""),soldDate:i.soldDate||""});setEditing(i.id);setShow(true);}
  function tc(i){return(i.cardCost||0)+(i.shippingCost||0)+(i.gradingCost||0);}
  function roi(i){const c=tc(i);return c&&i.estSellPrice?pc(i.estSellPrice,c):null;}
  function dIn(i){return i.sentDate?daysSince(i.sentDate):null;}
  function dLeft(i){const s=PSA_SERVICES.find(x=>x.k===i.service);if(!s||!i.sentDate)return null;const l=s.days-daysSince(i.sentDate);return l>0?l:0;}

  const pending=items.filter(i=>i.status!=="done"&&i.status!=="sold");
  const done=items.filter(i=>i.status==="done");
  const soldItems=items.filter(i=>i.status==="sold");
  const totalInvested=items.reduce((a,i)=>a+tc(i),0);
  const totalEstSell=done.filter(i=>i.estSellPrice).reduce((a,i)=>a+i.estSellPrice,0);
  const totalEstProfit=done.filter(i=>i.estSellPrice).reduce((a,i)=>a+i.estSellPrice-tc(i),0);
  const totalRealSell=soldItems.reduce((a,i)=>a+(i.realSellPrice||0),0);
  const totalRealProfit=soldItems.reduce((a,i)=>a+(i.realSellPrice||0)-tc(i),0);
  const rois=items.filter(i=>roi(i)!==null).map(i=>roi(i));
  const avgRoi=rois.length?rois.reduce((a,r)=>a+r,0)/rois.length:null;
  const graded=items.filter(i=>i.grade);
  const avgGrade=graded.length?graded.reduce((a,i)=>a+parseFloat(i.grade||0),0)/graded.length:null;

  const formRoiBase=(parseFloat(f.cardCost)||0)+(parseFloat(f.shippingCost)||0)+(parseFloat(f.gradingCost)||0);
  const formRoi=formRoiBase&&parseFloat(f.estSellPrice)?pc(parseFloat(f.estSellPrice),formRoiBase):null;

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div><div style={{fontSize:20,fontWeight:700}}>Seguimiento PSA / BGS</div><div style={{fontSize:12,color:SUB,marginTop:2}}>{items.length} cartas · {pending.length} en proceso · {done.length} recibidas</div></div>
        <Btn onClick={()=>{setF(blank);setEditing(null);setShow(true);}}>+ Añadir envío</Btn>
      </div>

      {/* Dashboard propio PSA */}
      {items.length>0&&(
        <div>
          <Card style={{marginBottom:12,display:"flex",flexWrap:"wrap"}}>
            <KT label="En proceso" value={pending.length} br/>
            <KT label="Recibidas" value={done.length} br/>
            <KT label="Total invertido" value={euk(totalInvested)} br/>
            <KT label="ROI est. medio" value={avgRoi!==null?sg(avgRoi)+avgRoi.toFixed(1)+"%":"—"} accent={avgRoi!==null?cl(avgRoi):MUT} br/>
            <KT label="Nota media" value={avgGrade!==null?avgGrade.toFixed(1):"—"} accent={BLUE}/>
          </Card>
          {(done.length>0||soldItems.length>0)&&<Card style={{marginBottom:20,padding:"14px 18px"}}>
            <SL style={{marginBottom:10}}>💰 Resumen económico</SL>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12,marginBottom:soldItems.length>0?12:0}}>
              {[{l:"Total invertido",v:euk(totalInvested),c:TXT},{l:"Venta estimada",v:euk(totalEstSell),c:BLUE,sub:"cartas recibidas"},{l:"Beneficio estimado",v:(totalEstProfit>=0?"+":"")+euk(totalEstProfit),c:cl(totalEstProfit)}].map(({l,v,c,sub})=>(
                <div key={l} style={{background:BGS,borderRadius:10,padding:"12px 14px",border:"1px solid "+BDR}}>
                  <div style={{fontSize:11,color:SUB,marginBottom:4}}>{l}</div>
                  <div style={{fontSize:18,fontWeight:700,color:c}}>{v}</div>
                  {sub&&<div style={{fontSize:10,color:MUT,marginTop:2}}>{sub}</div>}
                </div>
              ))}
            </div>
            {soldItems.length>0&&<div style={{borderTop:"1px solid "+BDR,paddingTop:12,marginTop:4}}>
              <div style={{fontSize:11,fontWeight:600,color:GREEN,marginBottom:8}}>✓ VENDIDAS ({soldItems.length})</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12}}>
                {[{l:"Invertido en vendidas",v:euk(soldItems.reduce((a,i)=>a+tc(i),0)),c:TXT},{l:"Ingresos reales",v:euk(totalRealSell),c:GREEN},{l:"Beneficio real",v:(totalRealProfit>=0?"+":"")+euk(totalRealProfit),c:cl(totalRealProfit)}].map(({l,v,c})=>(
                  <div key={l} style={{background:totalRealProfit>=0?"#f0fdf8":"#fff5f5",borderRadius:10,padding:"12px 14px",border:"1px solid "+(totalRealProfit>=0?"#d1fae5":"#fecaca")}}>
                    <div style={{fontSize:11,color:SUB,marginBottom:4}}>{l}</div>
                    <div style={{fontSize:18,fontWeight:700,color:c}}>{v}</div>
                  </div>
                ))}
              </div>
            </div>}
          </Card>}
          {/* Alertas: próximas a llegar */}
          {pending.filter(i=>dLeft(i)!==null&&dLeft(i)<=5).length>0&&(
            <Card style={{marginBottom:20,padding:"14px 18px",border:"1px solid #fde68a",background:"#fffbeb"}}>
              <SL style={{marginBottom:10,color:AMBER}}>⏱ Próximas a llegar</SL>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {pending.filter(i=>dLeft(i)!==null&&dLeft(i)<=5).map(i=>(
                  <div key={i.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 12px",borderRadius:8,background:dLeft(i)===0?"#fecaca":"#fde68a"}}>
                    <span style={{fontSize:13,fontWeight:600}}>{i.name}</span>
                    <span style={{fontSize:12,fontWeight:700,color:dLeft(i)===0?RED:AMBER}}>{dLeft(i)===0?"¡Debería haber llegado!":dLeft(i)+" días restantes"}</span>
                  </div>
                ))}
              </div>
            </Card>
          )}
        </div>
      )}

      {/* Formulario */}
      {show&&(
        <Card style={{padding:20,marginBottom:20}}>
          <div style={{fontSize:14,fontWeight:700,marginBottom:16}}>{editing?"Editar envío":"Nuevo envío a gradar"}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div><label style={LS}>Nombre de la carta *</label><input value={f.name} onChange={e=>sf("name",e.target.value)} placeholder="Charizard Base Set..." style={IS} autoFocus/></div>
            <div><label style={LS}>Serie / Set</label><input value={f.series} onChange={e=>sf("series",e.target.value)} placeholder="Base Set 1999..." style={IS}/></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:10}}>
            <div><label style={LS}>Coste carta (€)</label><input type="number" min="0" step="0.01" value={f.cardCost} onChange={e=>sf("cardCost",e.target.value)} placeholder="0.00" style={IS}/></div>
            <div><label style={LS}>Coste envío (€)</label><input type="number" min="0" step="0.01" value={f.shippingCost} onChange={e=>sf("shippingCost",e.target.value)} placeholder="0.00" style={IS}/></div>
            <div><label style={LS}>Coste gradación (€)</label><input type="number" min="0" step="0.01" value={f.gradingCost} onChange={e=>sf("gradingCost",e.target.value)} placeholder="0.00" style={IS}/></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:10}}>
            <div><label style={LS}>Fecha envío</label><input type="date" value={f.sentDate} onChange={e=>sf("sentDate",e.target.value)} style={IS}/></div>
            <div><label style={LS}>Servicio</label><select value={f.service} onChange={e=>sf("service",e.target.value)} style={IS}>{PSA_SERVICES.map(s=><option key={s.k} value={s.k}>{s.l} (~{s.days}d)</option>)}</select></div>
            <div><label style={LS}>Estado</label><select value={f.status} onChange={e=>sf("status",e.target.value)} style={IS}>{PSA_STATUS.map(([k,l])=><option key={k} value={k}>{l}</option>)}</select></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div><label style={LS}>Nota obtenida (si ya llegó)</label><input value={f.grade} onChange={e=>sf("grade",e.target.value)} placeholder="9, 9.5, 10..." style={IS}/></div>
            <div><label style={LS}>Precio venta estimado (€)</label><input type="number" min="0" step="0.01" value={f.estSellPrice} onChange={e=>sf("estSellPrice",e.target.value)} placeholder="0.00" style={IS}/></div>
          </div>
          {(f.status==="sold")&&<div style={{background:"#f0fdf8",border:"1px solid #d1fae5",borderRadius:10,padding:"12px 14px",marginBottom:10}}>
            <div style={{fontSize:11,fontWeight:600,color:GREEN,marginBottom:8}}>💰 VENTA REAL</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div><label style={LS}>Precio venta real (€)</label><input type="number" min="0" step="0.01" value={f.realSellPrice} onChange={e=>sf("realSellPrice",e.target.value)} placeholder="0.00" style={IS}/></div>
              <div><label style={LS}>Fecha venta</label><input type="date" value={f.soldDate||""} onChange={e=>sf("soldDate",e.target.value)} style={IS}/></div>
            </div>
            {f.realSellPrice&&formRoiBase>0&&<div style={{marginTop:10,padding:"8px 12px",background:BG,borderRadius:8,fontSize:13}}>
              ROI real: <b style={{color:cl(pc(parseFloat(f.realSellPrice),formRoiBase))}}>{sg(pc(parseFloat(f.realSellPrice),formRoiBase))}{pc(parseFloat(f.realSellPrice),formRoiBase).toFixed(1)}%</b>
              <span style={{color:MUT,marginLeft:12}}>Beneficio: <b style={{color:cl(parseFloat(f.realSellPrice)-formRoiBase)}}>{sg(parseFloat(f.realSellPrice)-formRoiBase)}{eu(parseFloat(f.realSellPrice)-formRoiBase)}</b></span>
            </div>}
          </div>}
          {formRoi!==null&&<div style={{background:formRoi>=0?"#f0fdf8":"#fff5f5",borderRadius:8,padding:"10px 14px",marginBottom:10,display:"flex",gap:20,fontSize:13}}>
            <span>Coste total: <b>{eu(formRoiBase)}</b></span>
            <span>ROI estimado: <b style={{color:cl(formRoi)}}>{sg(formRoi)}{formRoi.toFixed(1)}%</b></span>
            <span>Beneficio: <b style={{color:cl(parseFloat(f.estSellPrice)-formRoiBase)}}>{sg(parseFloat(f.estSellPrice)-formRoiBase)}{eu(parseFloat(f.estSellPrice)-formRoiBase)}</b></span>
          </div>}
          <div style={{marginBottom:14}}><label style={LS}>Notas</label><input value={f.notes} onChange={e=>sf("notes",e.target.value)} placeholder="Estado de la carta, expectativas..." style={IS}/></div>
          <div style={{display:"flex",gap:8}}><Btn v="outline" full onClick={()=>{setShow(false);setF(blank);setEditing(null);}}>Cancelar</Btn><Btn full disabled={!f.name} onClick={save}>Guardar</Btn></div>
        </Card>
      )}

      {/* Tabla */}
      {items.length===0&&!show?(<Card><Empty icon="🏆" title="Sin envíos registrados" sub="Añade cartas que has enviado a PSA o BGS para hacer seguimiento"/></Card>):(
        items.length>0&&<Card>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <TH cols={[["Carta"],["Coste total","right"],["Enviada","right"],["Días / Restantes","right"],["Estado","center"],["Nota","center"],["ROI est.","right"],["","right"]]}/>
            <tbody>{items.map(i=>{
              const totalC=tc(i),r=roi(i),din=dIn(i),dleft=dLeft(i),isDone=i.status==="done";
              return(
                <tr key={i.id} style={{borderBottom:"1px solid "+BDR}} onMouseEnter={e=>{e.currentTarget.style.background=BGS;}} onMouseLeave={e=>{e.currentTarget.style.background="transparent;";}}>
                  <td style={{padding:"11px 14px"}}><div style={{fontSize:13,fontWeight:600}}>{i.name}</div>{i.series&&<div style={{fontSize:11,color:MUT}}>{i.series}</div>}</td>
                  <td style={{padding:"9px 12px",textAlign:"right"}}><div style={{fontSize:13,fontWeight:600}}>{eu(totalC)}</div><div style={{fontSize:10,color:MUT}}>{eu(i.cardCost)}+{eu(i.shippingCost)}+{eu(i.gradingCost)}</div></td>
                  <td style={{padding:"9px 12px",textAlign:"right",fontSize:12,color:SUB}}>{i.sentDate||"—"}</td>
                  <td style={{padding:"9px 12px",textAlign:"right"}}>{isDone?<span style={{fontSize:11,color:GREEN,fontWeight:600}}>✓</span>:din!==null?<div><div style={{fontSize:12,fontWeight:600}}>{din}d</div>{dleft!==null&&<div style={{fontSize:10,color:dleft<=3?RED:AMBER}}>~{dleft}d</div>}</div>:"—"}</td>
                  <td style={{padding:"9px 12px",textAlign:"center"}}>{i.status==="sent"?<Bdg color={BLUE} bg="#eff4ff" dot>Enviada</Bdg>:i.status==="grading"?<Bdg color={AMBER} bg="#fffbeb" dot>En proceso</Bdg>:i.status==="sold"?<Bdg color={PURPLE} bg="#f5f3ff" dot>Vendida</Bdg>:<Bdg color={GREEN} bg="#f0fdf8" dot>Recibida</Bdg>}</td>
                  <td style={{padding:"9px 12px",textAlign:"center"}}>{i.grade?<span style={{fontSize:14,fontWeight:700,color:parseFloat(i.grade)>=9?GREEN:AMBER}}>PSA {i.grade}</span>:<span style={{color:MUT,fontSize:11}}>—</span>}</td>
                  <td style={{padding:"9px 12px",textAlign:"right"}}>{i.status==="sold"&&i.realSellPrice?<div><div style={{fontSize:13,fontWeight:700,color:cl(pc(i.realSellPrice,tc(i)))}}>{sg(pc(i.realSellPrice,tc(i)))}{pc(i.realSellPrice,tc(i)).toFixed(1)}%</div><div style={{fontSize:11,color:GREEN}}>{eu(i.realSellPrice)}</div></div>:r!==null?<div><div style={{fontSize:13,fontWeight:700,color:cl(r)}}>{sg(r)}{r.toFixed(1)}%</div><div style={{fontSize:11,color:MUT}}>{eu(i.estSellPrice)}</div></div>:<span style={{color:MUT,fontSize:11}}>—</span>}</td>
                  <td style={{padding:"9px 12px",textAlign:"right"}} onClick={e=>e.stopPropagation()}><div style={{display:"flex",gap:4}}><Btn sm v="outline" onClick={()=>openEdit(i)}>✏</Btn><Btn sm v="outline" style={{color:RED,borderColor:"#fecaca"}} onClick={()=>setItems(p=>p.filter(x=>x.id!==i.id))}>✕</Btn></div></td>
                </tr>
              );
            })}</tbody>
          </table>
        </Card>
      )}
    </div>
  );
}

function DupModal({card,onSave,onClose}){
  const existing=Array.from({length:card.quantity||1},(_,i)=>({id:i,price:String(card.buyPrice||0),isExisting:true}));
  const[units,setUnits]=useState(existing);
  function addUnit(){setUnits(p=>[...p,{id:Date.now(),price:"",isExisting:false}]);}
  function updatePrice(id,val){setUnits(p=>p.map(u=>u.id===id?{...u,price:val}:u));}
  function removeUnit(id){setUnits(p=>p.filter(u=>u.id!==id));}
  const parsed=units.map(u=>parseFloat(String(u.price).replace(",","."))||0);
  const totalUnits=units.length;
  const totalCost=parsed.reduce((a,v)=>a+v,0);
  const avgPrice=totalUnits>0?totalCost/totalUnits:0;
  const allFilled=units.every(u=>parseFloat(String(u.price).replace(",","."))||0 >0);
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:BG,borderRadius:16,width:"100%",maxWidth:400,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,0.18)",border:"1px solid "+BDR}}>
        <div style={{padding:"16px 22px",borderBottom:"1px solid "+BDR,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:15,fontWeight:700}}>⧉ Gestionar unidades</div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:18,color:MUT,cursor:"pointer"}}>✕</button>
        </div>
        <div style={{padding:"18px 22px"}}>
          <div style={{padding:"9px 12px",background:BGS,borderRadius:8,marginBottom:16,fontSize:13,fontWeight:600}}>{card.name}</div>
          <div style={{marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
              <label style={LS}>Unidades y precios individuales</label>
              <span style={{fontSize:11,color:MUT}}>{totalUnits} ud</span>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {units.map((u,i)=>(
                <div key={u.id} style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:11,color:SUB,minWidth:36,flexShrink:0}}>Ud {i+1}</span>
                  <input
                    type="number" min="0" step="0.01"
                    value={u.price}
                    onChange={e=>updatePrice(u.id,e.target.value)}
                    placeholder="0.00"
                    style={{...IS,flex:1,background:u.isExisting?"#eff4ff":BG,border:"1.5px solid "+(u.isExisting?"#bfdbfe":BDR)}}
                  />
                  <span style={{fontSize:11,color:MUT,flexShrink:0}}>€</span>
                  {u.isExisting
                    ?<span style={{fontSize:10,color:BLUE,whiteSpace:"nowrap",minWidth:52}}>existente</span>
                    :<button onClick={()=>removeUnit(u.id)} style={{background:"none",border:"none",color:RED,cursor:"pointer",fontSize:16,fontWeight:700,flexShrink:0,minWidth:20}}>✕</button>
                  }
                </div>
              ))}
            </div>
          </div>
          <Btn v="outline" full onClick={addUnit} style={{marginBottom:14}}>+ Añadir unidad</Btn>
          <div style={{background:"#eff4ff",border:"1px solid #bfdbfe",borderRadius:10,padding:"12px 14px",marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:600,color:BLUE,marginBottom:8}}>RESULTADO</div>
            {[["Total unidades",totalUnits+" ud"],["Coste total",eu(totalCost)],["Precio medio",eu(avgPrice)+"/ud"]].map(([l,v])=>(
              <div key={l} style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontSize:12,color:SUB}}>{l}</span>
                <span style={{fontSize:13,fontWeight:700}}>{v}</span>
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:8}}>
            <Btn v="outline" full onClick={onClose}>Cancelar</Btn>
            <Btn full disabled={totalUnits===0} onClick={()=>{
              onSave({...card,quantity:totalUnits,buyPrice:parseFloat(avgPrice.toFixed(2))});
              onClose();
            }}>Guardar</Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

export default function App(){
  const[cards,setCards]=useState(()=>{try{return JSON.parse(localStorage.getItem("cv10")||"[]");}catch{return[];}});
  const[dupCard,setDupCard]=useState(null);
  const[invoices,setInvoices]=useState(()=>{try{return JSON.parse(localStorage.getItem("cv10i")||"[]");}catch{return[];}});
  const[tab,setTab]=useState("dashboard"),[sf,setSF]=useState(false),[dm,setDm]=useState("inventory"),[ec,setEc]=useState(null),[sc,setSc]=useState(null);
  useEffect(()=>{localStorage.setItem("cv10",JSON.stringify(cards));},[cards]);
  useEffect(()=>{localStorage.setItem("cv10i",JSON.stringify(invoices));},[invoices]);
  function ups(c){setCards(p=>p.find(x=>x.id===c.id)?p.map(x=>x.id===c.id?c:x):[c,...p]);}
  function del(id){setCards(p=>p.filter(c=>c.id!==id));}
  function oa(m){setDm(m);setEc(null);setSF(true);}
  function oe(c){setEc(c);setDm(c.mode);setSF(true);}
  function dup(c){setDupCard(c);}
  const TABS=[["dashboard","Dashboard"],["inventory","Inventario"],["collection","Colección"],["fiscal","Fiscal"],["invoices","Facturas"],["analytics","Análisis"],["psa","PSA/BGS"]];
  return(
    <div style={{minHeight:"100vh",background:BGS,fontFamily:"Inter,sans-serif",color:TXT,fontSize:14}}>
      <style>{"@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');"}</style>
      <div style={{background:BG,borderBottom:"1px solid "+BDR,position:"sticky",top:0,zIndex:50}}>
        <div style={{maxWidth:1100,margin:"0 auto",padding:"0 24px",display:"flex",justifyContent:"space-between",alignItems:"center",height:54}}>
          <div style={{display:"flex",alignItems:"center",gap:24}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}><div style={{width:26,height:26,background:BLUE,borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}}>🃏</div><span style={{fontSize:14,fontWeight:700,letterSpacing:"-0.02em"}}>CromoVault</span></div>
            <nav style={{display:"flex",height:54}}>{TABS.map(([k,l])=>(<button key={k} onClick={()=>setTab(k)} style={{padding:"0 13px",height:"100%",border:"none",background:"none",borderBottom:"2px solid "+(tab===k?BLUE:"transparent"),color:tab===k?BLUE:SUB,fontFamily:"Inter,sans-serif",fontWeight:tab===k?600:500,fontSize:13,cursor:"pointer",whiteSpace:"nowrap"}}>{l}</button>))}</nav>
          </div>
          <div style={{display:"flex",gap:6}}>
            <Btn sm v="outline" onClick={()=>dlJSON(cards,invoices)}>⬇</Btn>
            <Btn sm v="outline" onClick={()=>ulJSON(setCards,setInvoices)}>⬆</Btn>
            <Btn sm v="outline" onClick={()=>dlPDF(cards)}>📄</Btn>
            <Btn sm onClick={()=>oa(tab==="collection"?"collection":"inventory")}>+ Nueva carta</Btn>
          </div>
        </div>
      </div>
      <div style={{maxWidth:1100,margin:"0 auto",padding:"24px"}}>
        {tab==="dashboard"&&<DashTab cards={cards} onEdit={oe} onDelete={del} onSell={setSc} onDuplicate={dup}/>}
        {tab==="inventory"&&<InvTab cards={cards} onEdit={oe} onDelete={del} onSell={setSc} onDuplicate={dup}/>}
        {tab==="collection"&&<ColTab cards={cards} onEdit={oe} onDelete={del} onDuplicate={dup}/>}
        {tab==="fiscal"&&<FiscalTab cards={cards} invoices={invoices}/>}
        {tab==="invoices"&&<InvoicesTab invoices={invoices} setInvoices={setInvoices}/> }
      {tab==="analytics"&&<AnalyticsTab cards={cards}/>}
      {tab==="psa"&&<PSATab/>}
      </div>
      {sf&&<CardForm onSave={ups} onClose={()=>{setSF(false);setEc(null);}} editCard={ec} defMode={dm}/>}
      {sc&&<SellModal card={sc} onSave={ups} onClose={()=>setSc(null)}/> }
      {dupCard&&<DupModal card={dupCard} onSave={ups} onClose={()=>setDupCard(null)}/>}
    </div>
  );
}


// Mount the app
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  </script>
</body>
</html>
